<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2930">
<title>Reef Log</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#132c32;background:#eef5f3;--ink:#132c32;--muted:#506970;--line:#d5e5e1;--teal:#087667}
*{box-sizing:border-box}
body{margin:0} header{background:#0b2930;color:#fff} .bar,main{max-width:1080px;margin:auto;padding-inline:clamp(16px,4vw,38px)}
.bar{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.04em}.brand span{color:#70ddc7}
nav,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 13px;font-weight:650}
button:hover{filter:brightness(.95)} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #37a99b;outline-offset:2px}
nav button{background:transparent;color:white;border-color:#47636a}nav button[aria-current]{background:#23464d}
.primary{background:var(--teal);color:white;border-color:transparent}
main{padding-block:30px 54px}.hero{background:#d6eee8;border:1px solid #c3e1da;border-radius:22px;padding:clamp(20px,5vw,42px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,6vw,3.7rem);letter-spacing:-.065em;line-height:1.05}h2{font-size:1.45rem;letter-spacing:-.035em}h3{font-size:1rem}.hero p{margin-top:10px;color:#365b5d}
section+section{margin-top:24px}.section-head{margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:12px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.card{display:grid;gap:7px;align-content:start}.card button{justify-self:start;margin-top:4px}
.value{font-size:1.85rem;font-weight:750;letter-spacing:-.05em}.unit,.muted{font-size:.9rem;color:var(--muted);letter-spacing:normal}.unit{font-weight:500}
.pill{justify-self:start;border-radius:30px;padding:3px 10px;font-size:.88rem;font-weight:700;background:#eef3f4;color:#35525b}.good{background:#d9f4e9;color:#155643}.warn{background:#fff0d6;color:#7d4300}.attention{display:grid;gap:10px}
label{display:grid;gap:5px;font-size:.9rem;font-weight:650} input,select,textarea{width:100%;min-width:0;border:1px solid #b6cdca;padding:8px;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}.check{display:flex;align-items:center;gap:8px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,135px),1fr));gap:12px}.settings-row{padding:13px 0;border-top:1px solid var(--line);display:grid;gap:9px}.stack{display:grid;gap:14px}
.chart{width:100%;height:245px;display:block;margin-block:12px}.history article{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;align-items:start;gap:10px}.note{white-space:pre-wrap;overflow-wrap:anywhere}
dialog{width:min(94vw,580px);max-height:90dvh;border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--ink)}dialog::backdrop{background:#061f27a8}.alert{color:#8a321d;font-weight:650}.footer{margin-top:25px;color:var(--muted);font-size:.9rem}
@media(max-width:550px){.bar{align-items:flex-start}.bar nav{width:100%}.history article{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span>Reef</span> Log</div><nav aria-label="Main navigation"><button data-view="overview">Overview</button><button data-view="history">History</button><button data-view="targets">Targets &amp; backup</button></nav></div></header>
<main id="main"></main>
<dialog id="entry"><form id="test-form" class="stack"></form></dialog>
<script>
'use strict';
const PARAMETERS = [
  ['alk','Alkalinity','dKH'], ['salt','Salinity','ppt'], ['ph','pH',''],
  ['temp','Temperature','°F'], ['no3','Nitrate','ppm'], ['po4','Phosphate','ppm'],
  ['ca','Calcium','ppm'], ['mg','Magnesium','ppm'], ['no2','Nitrite','ppm'],
  ['si','Silicate','ppm'], ['nh3','Ammonia','ppm']
];
const STORAGE = 'reef-log-v1';
const main = document.querySelector('#main');
const dialog = document.querySelector('#entry');
const form = document.querySelector('#test-form');
const defaults = () => ({version:1, name:'My reef', settings:{}, readings:[]});
let state = defaults();
let loadError = '';
try {
  const saved = localStorage.getItem(STORAGE);
  if (saved) state = validate(JSON.parse(saved));
} catch {
  loadError = 'The saved log could not be opened. You can restore a backup from Targets & backup.';
}
let page = 'overview';
let selected = 'alk';

function validate(data) {
  if (data?.version !== 1 || typeof data.name !== 'string' || !data.name.trim() ||
      !Array.isArray(data.readings) || !data.settings || typeof data.settings !== 'object') throw Error('Invalid log');
  const settings = {};
  for (const [key] of PARAMETERS) {
    if (!Object.hasOwn(data.settings,key)) continue;
    const item = data.settings[key];
    if (!item || typeof item.enabled !== 'boolean' ||
        ![item.low,item.high].every(value => value === null || Number.isFinite(value)) ||
        (item.low !== null && item.high !== null && item.low > item.high) ||
        (item.days !== null && (!Number.isInteger(item.days) || item.days < 1 || item.days > 3650))) throw Error('Invalid target');
    settings[key] = {enabled:item.enabled,low:item.low,high:item.high,days:item.days};
  }
  const ids = new Set();
  const readings = data.readings.map(row => {
    if (!row || typeof row.id !== 'string' || !row.id || ids.has(row.id) ||
        !PARAMETERS.some(([key]) => key === row.key) || !Number.isFinite(row.value) ||
        typeof row.note !== 'string' || !Number.isFinite(Date.parse(row.date))) throw Error('Invalid reading');
    ids.add(row.id);
    return {id:row.id,key:row.key,value:row.value,date:new Date(row.date).toISOString(),note:row.note};
  });
  return {version:1,name:data.name.trim().slice(0,60),settings,readings};
}
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const format = value => Number(value).toLocaleString(undefined,{maximumFractionDigits:12});
const dateText = value => new Date(value).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const config = key => state.settings[key] ?? {enabled:!['no2','si','nh3'].includes(key),low:null,high:null,days:null};
const records = key => state.readings.filter(row => row.key === key).sort((a,b) => b.date.localeCompare(a.date));
const active = () => PARAMETERS.filter(([key]) => config(key).enabled);
const parameter = key => PARAMETERS.find(item => item[0] === key);

function save(next) {
  localStorage.setItem(STORAGE,JSON.stringify(next));
  state = next;
  loadError = '';
}

function range({low,high},unit) {
  if (low === null && high === null) return 'Target unset';
  const bounds = low === null ? '≤ ' + format(high) : high === null ? '≥ ' + format(low) : format(low) + '–' + format(high);
  return 'Target ' + bounds + (unit ? ' ' + unit : '');
}

function assess(reading,{low,high,days}) {
  if (!reading) return {label:'No readings',tone:'',due:false,direction:''};
  const direction = low !== null && reading.value < low ? 'Below' : high !== null && reading.value > high ? 'Above' : '';
  const due = days !== null && Date.now() - Date.parse(reading.date) >= days * 86400000;
  if (direction) return {label:direction + ' target',tone:'warn',due,direction};
  if (low === null && high === null) return {label:'Target unset',tone:'',due,direction};
  return {label:'In range',tone:'good',due,direction};
}

function render() {
  document.querySelectorAll('[data-view]').forEach(button => {
    if (button.dataset.view === page) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  main.innerHTML = (loadError ? '<p class="alert" role="alert">' + esc(loadError) + '</p>' : '') +
    ({overview,history,targets}[page])() +
    '<p class="footer">Your log is stored in this browser. Export a backup from Targets &amp; backup.</p>';
  if (page === 'history') draw();
}

function overview() {
  const items = active().map(([key,name,unit]) => {
    const setting = config(key);
    const reading = records(key)[0];
    return {key,name,unit,reading,setting,...assess(reading,setting)};
  });
  const issues = items.filter(item => item.direction || item.due);
  return `<section class="hero"><div><h1>${esc(state.name)}</h1><p>Water tests and target ranges</p></div><button class="primary" data-add>Add water test</button></section>
  <section><div class="section-head"><h2>Attention</h2></div><div class="panel attention">${issues.length ? issues.map(item =>
    `<div><strong>${item.name}</strong> · ${item.direction ? `${item.label} at ${format(item.reading.value)} ${item.unit}. ${range(item.setting,item.unit)}. Retest to confirm before adjusting.` : 'Due for a test.'}
    ${item.direction && item.due ? 'Also due for a test.' : ''}</div>`).join('') :
    items.some(item => item.reading && item.label === 'In range') ? 'No recorded readings are flagged.' : 'Set targets and log a water test to check your readings.'}</div></section>
  <section><div class="section-head"><h2>Latest readings</h2><button data-view="targets">Edit targets</button></div>
    <div class="grid">${items.map(item => `<article class="card"><h3>${item.name}</h3>
      <div class="value">${item.reading ? format(item.reading.value) : '—'} <span class="unit">${item.unit}</span></div>
      <span class="pill ${item.tone}">${item.label}</span>
      <p class="muted">${range(item.setting,item.unit)}${item.due ? ' · Test due' : ''}</p>
      ${item.reading ? `<p class="muted">${dateText(item.reading.date)}</p>` : ''}
      <button data-history="${item.key}">View history</button></article>`).join('') || '<p>Enable a parameter in Targets &amp; backup to get started.</p>'}</div>
  </section>`;
}

function history() {
  const [key,name,unit] = parameter(selected);
  const readings = records(key);
  return `<section><div class="section-head"><h1>History</h1><button class="primary" data-add="${key}">Add water test</button></div>
    <div class="panel"><label>Parameter<select id="history-filter">${PARAMETERS.map(([id,label]) => `<option value="${id}" ${id===key?'selected':''}>${label}</option>`).join('')}</select></label>
    ${readings.length ? `<canvas class="chart" id="chart" role="img" aria-label="${name} trend. Values are listed below."></canvas>
    <p class="muted">${range(config(key),unit)} · Latest ${Math.min(readings.length,60)} plotted</p>` : '<p class="muted">No readings for this parameter yet.</p>'}</div></section>
    <section class="panel history"><h2>${name} readings</h2>${readings.map(row => `<article><div><strong>${format(row.value)} ${unit}</strong><div class="muted">${dateText(row.date)}</div>
    ${row.note ? `<p class="note">${esc(row.note)}</p>` : ''}</div><div class="actions"><button data-edit="${esc(row.id)}">Edit</button><button data-delete="${esc(row.id)}">Delete</button></div></article>`).join('') || '<p class="muted">Once saved, tests appear here.</p>'}</section>`;
}

function draw() {
  const canvas = document.querySelector('#chart');
  if (!canvas) return;
  const points = records(selected).slice(0,60).reverse();
  const {low,high} = config(selected);
  const series = points.map(row => row.value);
  const min = Math.min(...series,...[low,high].filter(value => value !== null));
  const max = Math.max(...series,...[low,high].filter(value => value !== null));
  const pad = (max-min)*.12 || Math.max(Math.abs(max)*.04,.01);
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const {width,height} = canvas.getBoundingClientRect();
  const scale = window.devicePixelRatio || 1;
  canvas.width = width*scale;
  canvas.height = height*scale;
  ctx.scale(scale,scale);
  const top = 12, bottom = height-32;
  ctx.font = '12px system-ui';
  const ticks = Array.from({length:5},(_,i) => min-pad+i*(max-min+2*pad)/4);
  const left = Math.max(45,...ticks.map(value => ctx.measureText(format(Number(value.toPrecision(6)))).width+10));
  const right = width-12;
  const y = value => bottom-(value-min+pad)/(max-min+2*pad)*(bottom-top);
  const dateStart = Date.parse(points[0].date);
  const dateEnd = Date.parse(points.at(-1).date);
  const x = row => dateEnd === dateStart ? (left+right)/2 : left+(Date.parse(row.date)-dateStart)/(dateEnd-dateStart)*(right-left);
  if (low !== null || high !== null) {
    const start = high === null ? top : y(high);
    ctx.fillStyle = '#d9f4e9';
    ctx.fillRect(left,start,right-left,(low === null ? bottom : y(low))-start);
  }
  for (const value of ticks) {
    ctx.strokeStyle = '#d5e5e1';
    ctx.beginPath(); ctx.moveTo(left,y(value)); ctx.lineTo(right,y(value)); ctx.stroke();
    ctx.fillStyle = '#506970';
    ctx.fillText(format(Number(value.toPrecision(6))),0,y(value)+4);
  }
  ctx.strokeStyle = '#087667'; ctx.lineWidth = 2.5; ctx.beginPath();
  points.forEach((row,index) => index ? ctx.lineTo(x(row),y(row.value)) : ctx.moveTo(x(row),y(row.value)));
  ctx.stroke();
  ctx.fillStyle = '#087667';
  for (const row of points) {
    ctx.beginPath(); ctx.arc(x(row),y(row.value),3.5,0,Math.PI*2); ctx.fill();
  }
  const shortDate = value => new Date(value).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  ctx.fillStyle = '#506970';
  ctx.fillText(shortDate(dateStart),left,bottom+22);
  if (dateEnd !== dateStart) {
    const label = shortDate(dateEnd);
    ctx.fillText(label,right-ctx.measureText(label).width,bottom+22);
  }
}

function targets() {
  return `<section class="stack"><h1>Targets</h1><form id="targets-form" class="panel stack">
    <label>Tank name<input name="name" required maxlength="60" value="${esc(state.name)}"></label>
    <p class="muted">Set the minimum, maximum, or both for your tank. Set a test interval to flag overdue readings on the overview.</p>
    ${PARAMETERS.map(([key,name,unit]) => {
      const {low,high,days,enabled} = config(key);
      return `<div class="settings-row"><label class="check"><input name="${key}-enabled" type="checkbox" ${enabled?'checked':''}> Show ${name} ${unit ? '('+unit+')' : ''}</label>
      <div class="fields"><label>Minimum<input name="${key}-low" type="number" step="any" value="${low ?? ''}"></label>
      <label>Maximum<input name="${key}-high" type="number" step="any" value="${high ?? ''}"></label>
      <label>Test interval (days)<input name="${key}-days" type="number" min="1" max="3650" step="1" value="${days ?? ''}"></label></div></div>`;
    }).join('')}
    <div><button class="primary">Save targets</button></div><p role="status" id="settings-message"></p></form></section>
    <section class="panel stack"><h2>Backup</h2><p>Export your readings and targets or restore them from a backup file.</p>
    <div class="actions"><button id="export">Export backup</button><button id="import">Restore backup</button><input hidden id="backup" type="file" accept=".json,application/json"></div>
    <p role="status" id="backup-message"></p></section>`;
}

function localDate(value) {
  const date = new Date(value);
  return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
}

function showEntry(key,row) {
  const available = row || key ? PARAMETERS : active();
  const choices = available.length ? available : PARAMETERS;
  const preselected = row?.key || key || choices[0][0];
  form.innerHTML = `<h2 id="entry-title">${row ? 'Edit water test' : 'Add water test'}</h2>
    <label>Test date and time<input type="datetime-local" name="date" required value="${localDate(row?.date ?? Date.now())}"></label>
    ${row ? `<label>Parameter<select name="parameter">${choices.map(([id,name,unit]) =>
      `<option value="${id}" ${id===preselected?'selected':''}>${name} ${unit}</option>`).join('')}</select></label>
      <label>Reading<input name="value" type="number" step="any" required value="${row.value}"></label>` :
      `<p class="muted">Fill in the readings you took. Leave the rest blank.</p><div class="fields">${choices.map(([id,name,unit]) =>
      `<label>${name} ${unit ? '('+unit+')' : ''}<input type="number" step="any" name="${id}"></label>`).join('')}</div>`}
    <label>Notes<textarea name="note" rows="2" maxlength="1000">${esc(row?.note ?? '')}</textarea></label>
    <p class="alert" role="alert" id="entry-error"></p><div class="actions"><button class="primary">Save ${row ? 'reading' : 'readings'}</button>
    <button type="button" id="cancel">Cancel</button></div>`;
  dialog.setAttribute('aria-labelledby','entry-title');
  form.onsubmit = event => {
    event.preventDefault();
    const data = new FormData(form);
    const date = new Date(data.get('date')).toISOString();
    const note = data.get('note').trim();
    const input = row ? [[data.get('parameter'),data.get('value')]] : choices.map(([id]) => [id,data.get(id)]);
    const added = input.filter(([,value]) => value !== '').map(([id,value]) => ({
      id:row?.id ?? (crypto.randomUUID?.() ?? Date.now()+'-'+id+'-'+Math.random().toString(36).slice(2)),
      key:id,value:Number(value),date,note
    }));
    const error = form.querySelector('#entry-error');
    if (!added.length) { error.textContent = 'Enter at least one reading.'; return; }
    try {
      save({...state,readings:[...state.readings.filter(item => item.id !== row?.id),...added]});
      if (page === 'history' && row) selected = added[0].key;
      dialog.close();
      render();
    } catch { error.textContent = 'Could not save in this browser.'; }
  };
  form.querySelector('#cancel').onclick = () => dialog.close();
  dialog.showModal();
  if (!row && key) form.elements.namedItem(key)?.focus();
}

document.addEventListener('click',event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.view) { page=button.dataset.view; render(); window.scrollTo(0,0); }
  if (button.dataset.history) { selected=button.dataset.history; page='history'; render(); window.scrollTo(0,0); }
  if (button.hasAttribute('data-add')) showEntry(button.dataset.add);
  if (button.dataset.edit) {
    const row = state.readings.find(item => item.id === button.dataset.edit);
    if (row) showEntry(row.key,row);
  }
  if (button.dataset.delete && confirm('Delete this reading?')) {
    try { save({...state,readings:state.readings.filter(item => item.id !== button.dataset.delete)}); render(); }
    catch { alert('Could not save the change in this browser.'); }
  }
  if (button.id === 'export') {
    const url = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const link = document.createElement('a');
    link.href = url; link.download = 'reef-log-backup.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(url),1000);
  }
  if (button.id === 'import') document.querySelector('#backup').click();
});

main.addEventListener('submit',event => {
  if (event.target.id !== 'targets-form') return;
  event.preventDefault();
  const data = new FormData(event.target);
  const message = document.querySelector('#settings-message');
  const name = data.get('name').trim();
  if (!name) { message.textContent = 'Enter a tank name.'; return; }
  const settings = {};
  const number = key => data.get(key) === '' ? null : Number(data.get(key));
  for (const [key,label] of PARAMETERS) {
    const low = number(key+'-low'), high = number(key+'-high');
    if (low !== null && high !== null && low > high) {
      message.textContent = label + ' minimum must be at or below its maximum.';
      event.target.elements.namedItem(key+'-low').focus();
      return;
    }
    settings[key] = {enabled:data.has(key+'-enabled'),low,high,days:number(key+'-days')};
  }
  try {
    save({...state,name,settings});
    message.textContent = 'Targets saved.';
  } catch { message.textContent = 'Could not save the targets in this browser.'; }
});

main.addEventListener('change',async event => {
  if (event.target.id === 'history-filter') { selected=event.target.value; render(); document.querySelector('#history-filter').focus(); }
  if (event.target.id !== 'backup') return;
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const message = document.querySelector('#backup-message');
  let restored;
  try { restored = validate(JSON.parse(await file.text())); }
  catch { message.textContent = 'This file is not a valid Reef Log backup.'; return; }
  if (!confirm('Replace this browser’s readings and targets with the backup?')) return;
  try { save(restored); render(); document.querySelector('#backup-message').textContent = 'Backup restored.'; }
  catch { message.textContent = 'Could not restore the backup in this browser.'; }
});

window.addEventListener('resize',draw);
render();
</script>
</body>
</html>
